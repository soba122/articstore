<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArticMc.lol — المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#081226;--card:#102042;--line:#1d3560;--ice:#7fd4ff;--ice2:#bfeaff;--tx:#e8f3ff;--mu:#8da6c7;--ok:#4ade80;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 80% -10%,#16346a 0,var(--bg) 55%) fixed;color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;overflow-x:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,22,46,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,22,46,.92);z-index:19}
.logo{height:44px;border-radius:8px;cursor:pointer}
.ib{background:none;border:0;color:var(--ice);font-size:26px;width:44px;height:44px;border-radius:12px;cursor:pointer;position:relative;display:grid;place-items:center}
.ib:active{background:var(--card)}
.burger{width:24px;height:18px;position:relative}
.burger i{position:absolute;inset-inline:0;height:2.5px;background:var(--ice);border-radius:3px;transition:.35s}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:8px}.burger i:nth-child(3){top:16px}
.open .burger i:nth-child(1){top:8px;transform:rotate(45deg)}
.open .burger i:nth-child(2){opacity:0;transform:scaleX(0)}
.open .burger i:nth-child(3){top:8px;transform:rotate(-45deg)}
.badge{position:absolute;top:2px;inset-inline-start:2px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.5)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:30}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:78%;max-width:300px;background:#0c1a38;border-inline-end:1px solid var(--line);transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:31;padding:70px 14px 20px;display:flex;flex-direction:column;gap:6px}
.open .ov{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.drawer a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;color:var(--tx);font-size:16px;cursor:pointer;opacity:0;transform:translateX(30px);transition:.3s}
.open .drawer a{opacity:1;transform:none}
.open .drawer a:nth-child(1){transition-delay:.12s}.open .drawer a:nth-child(2){transition-delay:.17s}.open .drawer a:nth-child(3){transition-delay:.22s}.open .drawer a:nth-child(4){transition-delay:.27s}.open .drawer a:nth-child(5){transition-delay:.32s}
.drawer a.on{background:var(--card);color:var(--ice)}
.drawer .ib{position:absolute;top:8px;inset-inline-start:8px}
main{max-width:900px;margin:0 auto;padding:16px 14px 40px}
.pg{animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
h2{margin:4px 0 14px;font-size:20px}
.hero{text-align:center;padding:18px 10px 22px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(160deg,#1a4a86,#0c2149);border:1px solid var(--line);margin-bottom:22px}
.hero img{width:230px;max-width:70%;border-radius:14px;animation:fl 4s ease-in-out infinite;box-shadow:0 12px 30px rgba(0,0,0,.4)}
@keyframes fl{50%{transform:translateY(-8px)}}
.hero p{color:var(--ice2);margin:12px 0 16px}
.snow{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:sn linear infinite}
@keyframes sn{to{transform:translateY(340px)}}
.btn{background:linear-gradient(180deg,#9fe0ff,#5ec0f5);color:#052038;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.96)}
.btn.alt{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.45}
.btn.w{width:100%;margin-top:6px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.25s;font-size:14px}
.cat:hover{transform:translateY(-4px);border-color:var(--ice)}
.cat .i{font-size:30px;color:var(--ice);display:block;margin:0 auto 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;cursor:pointer;transition:.2s}
.chip.on{background:var(--ice);color:#052038;font-weight:700}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:inherit;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.cats{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;animation:up .5s ease both;transition:.25s}
.pc:hover{transform:translateY(-4px);border-color:var(--ice)}
.pi{font-size:46px;color:var(--ice);display:grid;place-items:center;height:92px;border-radius:12px;background:linear-gradient(160deg,#16305e,#0b1832);position:relative}
.off{position:absolute;top:6px;inset-inline-end:6px;background:var(--bad);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.pc h3{margin:0;font-size:15px}.pc p{margin:0;color:var(--mu);font-size:12px;flex:1}
.pr{font-weight:800;color:var(--ice)}.old{color:var(--mu);text-decoration:line-through;font-size:12px;margin-inline-start:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#0b1832;color:var(--tx);cursor:pointer;font-size:16px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--ice2)}
input.f{width:100%;background:#0b1832;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx);font:inherit;direction:ltr;text-align:left}
input.f:focus,.search:focus{outline:2px solid var(--ice)}
.err{color:var(--bad);font-size:12px;min-height:16px}
.warn{background:#35280f;border:1px solid #7d5f1c;color:#ffd98a;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}
.tot{font-size:18px;font-weight:800}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}.empty .i{font-size:54px;color:var(--ice);display:block;margin:0 auto 10px}
.codes{display:flex;gap:6px;direction:ltr;justify-content:center;margin:8px 0}
.codes input{width:42px;height:50px;text-align:center;font-size:22px;font-weight:800;background:#0b1832;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-family:inherit;transition:.2s}
.codes input:focus{outline:2px solid var(--ice);transform:translateY(-2px)}
.codes.bad{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ok{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

cart(){const ids=Object.keys(state.cart);

<button class="btn w" onclick="verifyCode()">متابعة</button>
<button class="btn alt w" id="rs" onclick="resend()" disabled>إعادة إرسال الكود</button>
<button class="btn alt w" style="color:var(--bad);border-color:var(--bad)" onclick="cancelV()">إلغاء</button></div>`},
login(){return `<h2>تسجيل الدخول</h2><div class="box"><label>البريد الإلكتروني</label><input class="f" id="le" type="email" autocomplete="email"><label>كلمة المرور</label><input class="f" id="lp" type="password" autocomplete="current-password"><div class="err" id="vm"></div><button class="btn w" id="lb" onclick="doLogin()">دخول</button></div><p style="text-align:center;color:var(--mu)">ما عندك حساب؟ <a style="color:var(--ice);cursor:pointer" onclick="go('register')">أنشئ حساباً</a></p>`},
register(){return `<h2>إنشاء حساب</h2><div class="box"><label>اسم اللاعب في ماينكرافت</label><input class="f" id="ru" maxlength="16" placeholder="Steve_123"><label>البريد الإلكتروني</label><input class="f" id="re" type="email" autocomplete="email"><label>كلمة المرور (8 أحرف على الأقل)</label><input class="f" id="rp" type="password" autocomplete="new-password"><label>تأكيد كلمة المرور</label><input class="f" id="rq" type="password" autocomplete="new-password"><div class="err" id="vm"></div><button class="btn w" id="rb" onclick="doRegister()">متابعة</button></div><p style="text-align:center;color:var(--mu)">عندك حساب؟ <a style="color:var(--ice);cursor:pointer" onclick="go('login')">سجّل الدخول</a></p>`},
account(){if(!state.user)return V.login();return `<h2>حسابي</h2><div class="box"><div class="row"><span>اسم اللاعب</span><b dir="ltr">${esc(state.user.username)}</b></div><div class="row"><span>البريد</span><b dir="ltr">${esc(state.user.email)}</b></div></div><button class="btn w" onclick="go('orders')">طلباتي</button><button class="btn alt w" style="color:var(--bad);border-color:var(--bad)" onclick="doLogout()">تسجيل الخروج</button>`},
payment(){const t=totals();
return `<h2>الدفع</h2><div class="box"><div class="row"><span>رقم الطلب</span><span>يُنشأ من الخادم</span></div><div class="row"><span>اللاعب</span><span dir="ltr">${state.form.u||'-'}</span></div>
${Object.keys(state.cart).map(id=>`<div class="row"><span>${find(id).n} × ${state.cart[id]}</span><span>${sar(find(id).p*state.cart[id])}</span></div>`).join('')}
<div class="row tot"><span>الإجمالي</span><span>${sar(t.tot)}</span></div></div>
<div class="box"><h3>طريقة الدفع</h3><p style="color:var(--mu);font-size:13px">مدى، فيزا، ماستركارد، Apple Pay حسب تفعيل حساب التاجر</p>
<div class="warn">نموذج البطاقة الآمن غير مفعّل بعد. يتطلب حساب Moyasar ومفاتيح الاختبار ودوال Netlify. لن يظهر نجاح الدفع إلا بعد تأكيد المزوّد عبر الـ webhook.</div><button class="btn w" disabled>ادفع الآن</button></div>
<button class="btn alt w" onclick="go('checkout')">رجوع</button>`},
orders(){if(!state.user)return V.login();return `<h2>طلباتي</h2><div class="empty">${svg('list')}<p>لا توجد طلبات حالياً.<br>سيظهر سجل طلباتك هنا بعد ربط الخادم.</p></div>`},
support(){return `<h2>الدعم</h2><div class="box"><h3>عنوان السيرفر</h3><p dir="ltr" style="text-align:right;color:var(--ice);font-weight:800;font-size:20px;margin:6px 0">ArticMc.lol</p></div>
<div class="box"><h3>الحالات</h3><p style="color:var(--mu);font-size:13px;line-height:2">بانتظار الدفع · جاري التحقق من الدفع · تم الدفع · جاري تسليم الطلب · تم التسليم · فشل الدفع · تم إلغاء الطلب</p></div>`}
};
function sg(){const l=P.filter(p=>(state.cat==='الكل'||p.c===state.cat)&&(p.n+p.d).includes(state.q.trim()));$('#g').innerHTML=l.map(card).join('')||'<p class="empty">لا توجد منتجات مطابقة</p>'}
let tm;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vm=(s,ok)=>{const e=$('#vm');if(e){e.textContent=s;e.className='err'+(ok?' ok':'')}};
async function post(u,b){try{const r=await fetch('/.netlify/functions/'+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));return{ok:r.ok,msg:j.message,j}}catch(e){return{ok:false,msg:'خدمة التحقق غير متصلة بالخادم بعد'}}}
async function sendCode(){const r=await post('send-code',{email:state.form.m});if(r.ok){state.cdEnd=Date.now()+60000;state.sentTo=state.form.m}return r}
function tick(){const b=$('#rs');if(!b){clearInterval(tm);return}const s=Math.ceil(((state.cdEnd||0)-Date.now())/1000);
if(s>0){b.disabled=true;b.textContent='إعادة الإرسال بعد '+s+' ثانية'}else{b.disabled=false;b.textContent='إعادة إرسال الكود';clearInterval(tm)}}
function startTick(){clearInterval(tm);tick();tm=setInterval(tick,1000)}
async function resend(){const b=$('#rs');b.disabled=true;vm('جاري إرسال الكود…');const r=await sendCode();
vm(r.ok?'تم إرسال كود جديد إلى بريدك':(r.msg||'تعذر إرسال الكود'),r.ok);startTick()}
function cin(i){const e=$('#c'+i);e.value=e.value.replace(/\D/g,'');if(e.value&&i<5)$('#c'+(i+1)).focus()}
function ck(ev,i){if(ev.key==='Backspace'&&!$('#c'+i).value&&i>0)$('#c'+(i-1)).focus()}
function cancelV(){clearInterval(tm);go(state.after==='register'?'register':'checkout')}
async function verifyCode(){const c=[0,1,2,3,4,5].map(i=>$('#c'+i).value).join('');
if(c.length<6){vm('أدخل الكود كاملاً (6 أرقام)');return}
const r=await post('verify-code',{email:state.form.m,code:c});
if(r.ok){state.ver=state.form.m;vm('تم تأكيد بريدك بنجاح',true);clearInterval(tm);setTimeout(()=>state.after==='register'?finishRegister():go('payment'),700)}
else{vm(r.msg||'الكود غير صحيح أو منتهي');const k=document.querySelector('.codes');k.classList.remove('bad');void k.offsetWidth;k.classList.add('bad')}}
async function toPay(){const u=$('#u').value.trim(),m=$('#m').value.trim().toLowerCase();let ok=true;$('#eu').textContent=$('#em').textContent='';vm('');
if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){$('#eu').textContent='اسم اللاعب من 3 إلى 16 حرفاً إنجليزياً أو أرقاماً أو _';ok=false}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){$('#em').textContent='أدخل بريداً إلكترونياً صحيحاً';ok=false}
if(!ok)return;state.form={u,m};state.after='payment';
if(state.ver===m||(state.user&&state.user.email===m)){go('payment');return}
if(state.sentTo===m&&(state.cdEnd||0)>Date.now()){go('verify');return}
const b=$('#cb');b.disabled=true;vm('جاري إرسال كود التأكيد…');
const r=await sendCode();
if(r.ok)go('verify');else{vm(r.msg||'تعذر إرسال الكود، حاول لاحقاً');b.disabled=false}}
async function doLogin(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;vm('');
if(!e||!p){vm('أدخل البريد وكلمة المرور');return}
const b=$('#lb');b.disabled=true;const r=await post('login',{email:e,password:p});
if(r.ok){state.user=r.j.user;go('account')}else{vm(r.msg||'تعذر تسجيل الدخول');b.disabled=false}}
async function doRegister(){const u=$('#ru').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value,q=$('#rq').value;vm('');
if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){vm('اسم اللاعب من 3 إلى 16 حرفاً إنجليزياً أو أرقاماً أو _');return}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){vm('أدخل بريداً إلكترونياً صحيحاً');return}
if(p.length<8){vm('كلمة المرور 8 أحرف على الأقل');return}
if(p!==q){vm('كلمتا المرور غير متطابقتين');return}
state.reg={email:e,username:u,password:p};state.form.m=e;state.after='register';
if(state.sentTo===e&&(state.cdEnd||0)>Date.now()){go('verify');return}
const b=$('#rb');b.disabled=true;vm('جاري إرسال كود التأكيد…');const r=await sendCode();
if(r.ok)go('verify');else{vm(r.msg||'تعذر إرسال الكود');b.disabled=false}}
async function finishRegister(){const r=await post('register',state.reg);
if(r.ok){state.user=r.j.user;state.reg=null;state.after='payment';go('account')}
else{vm(r.msg||'تعذر إنشاء الحساب');setTimeout(()=>go('register'),1800)}}
async function doLogout(){await post('logout',{});state.user=null;go('home')}
function loadMe(){fetch('/.netlify/functions/me').then(r=>r.ok?r.json():null).then(u=>{if(u){state.user=u;render()}}).catch(()=>{})}
function render(bump){
const n=Object.values(state.cart).reduce((a,b)=>a+b,0),c=$('#cc');c.textContent=n;c.style.display=n?'grid':'none';
if(bump===true){c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
$('#dr').innerHTML=`<button class="ib" onclick="tg()" aria-label="إغلاق">${svg('help').replace(/<path[^>]*>/,'<path d="M6 6l12 12M18 6L6 18"/>')}</button>`+navList().map(([k,t,i])=>`<a class="${k===state.v?'on':''}" onclick="go('${k}')">${svg(i)} ${t}</a>`).join('');
const m=$('#app');m.innerHTML=`<div class="pg">${(V[state.v]||V.home)()}</div>`;
if(state.v==='verify'){startTick();const c0=$('#c0');if(c0)c0.focus()}
}
const h=(location.hash||'').slice(1);if(V[h])state.v=h;
render();
loadMe();
</script>
</body>
</html>
